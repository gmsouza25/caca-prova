<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a2145"/>
      <stop offset="60%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#0f1226"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#eef1ff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- fundo arredondado -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- brilho por trás da mira -->
  <circle cx="256" cy="250" r="205" fill="url(#glow)"/>

  <!-- mira / alvo (caça) -->
  <circle cx="256" cy="250" r="150" fill="none" stroke="#22c55e" stroke-width="18"/>
  <circle cx="256" cy="250" r="100" fill="none" stroke="#4ade80" stroke-width="16"/>
  <circle cx="256" cy="250" r="52" fill="none" stroke="#22c55e" stroke-width="14"/>
  <circle cx="256" cy="250" r="20" fill="#4ade80"/>

  <!-- traços da mira -->
  <g stroke="#22c55e" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="72" x2="256" y2="104"/>
    <line x1="256" y1="396" x2="256" y2="428"/>
    <line x1="78" y1="250" x2="110" y2="250"/>
    <line x1="402" y1="250" x2="434" y2="250"/>
  </g>

  <!-- lupa sobre o centro (buscar o edital ideal) -->
  <circle cx="272" cy="238" r="104" fill="url(#lens)" stroke="#eef1ff" stroke-width="22"/>
  <path d="M344 312 L400 368" stroke="#eef1ff" stroke-width="30" stroke-linecap="round"/>
  <!-- reflexo da lente -->
  <path d="M214 188 Q 244 158 282 152" stroke="#ffffff" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- check de aprovação dentro do alvo/lupa -->
  <path d="M236 244 L 262 272 L 312 210" fill="none" stroke="#4ade80" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
